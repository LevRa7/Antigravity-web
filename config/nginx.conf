map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # HTTP Basic Authentication
    auth_basic "Antigravity Password Security (Login: admin / Password: ST720p)";
    auth_basic_user_file /etc/nginx/.antigravity_passwd;

    # Redirect /onboarding to /login
    location /onboarding {
        return 302 /login;
    }

    # Serve static favicons
    location = /favicon.ico {
        root /usr/local/openresty/nginx/html;
        add_header Content-Type "image/x-icon";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.svg {
        root /usr/local/openresty/nginx/html;
        add_header Content-Type "image/svg+xml";
        add_header Cache-Control "public, max-age=86400";
    }

    # Serve login.html page
    location = /login {
        alias /usr/local/openresty/nginx/html/login.html;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache";
    }

    # REST API for multi-account management (auth_server.js on 8088)
    location /auth-api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OpenAI proxy endpoint
    location /api/openai-proxy {
        proxy_pass http://127.0.0.1:8088/api/openai-proxy;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Return valid empty JSON for sourcemaps to eliminate browser sourcemap parser errors
    location ~ \.map$ {
        default_type application/json;
        return 200 mappings:;
    }

    # Serve polyfill file with strict no-cache/no-store
    location = /polyfill.js {
        root /usr/local/openresty/nginx/html;
        add_header Content-Type "text/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Dedicated locations for gRPC-Web / Connect streaming calls (No sub_filter, raw HTTP/1.1 stream to 8085)
    location ~ ^/(exa\.|google\.|connect\.|rpc\.) {
        proxy_pass http://127.0.0.1:8085;

        proxy_set_header Host 127.0.0.1;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_max_temp_file_size 0;
    }

    # Main Web IDE location
    location / {
        proxy_pass http://127.0.0.1:8085;

        proxy_set_header Host 127.0.0.1;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable upstream compression ONLY for HTML requests so sub_filter can parse HTML
        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Inject polyfill script tag into HTML pages
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter "<head>" "<head><script src=\"/polyfill.js?v=2.7.0\"></script>";
    }
}
