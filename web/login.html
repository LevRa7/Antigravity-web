<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Antigravity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #e3e3e3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .glow-parent {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      width: 340px;
      height: 340px;
      top: -130px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(49, 134, 255, 0.18) 0%, rgba(252, 65, 61, 0.1) 35%, rgba(0, 0, 0, 0) 70%);
      filter: blur(20px);
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-wrapper {
      width: 64px;
      height: 64px;
      margin-bottom: 2rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title {
      font-size: 1.65rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #f1f5f9;
      margin-bottom: 2rem;
      text-align: center;
    }

    .card-wrapper {
      width: 100%;
      background: #181818;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #888888;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .account-list::-webkit-scrollbar {
      width: 4px;
    }

    .account-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .account-card {
      background: #222222;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 0.75rem 0.875rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }

    .account-card:hover {
      background: #2a2a2a;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .account-card.active {
      border-color: rgba(49, 134, 255, 0.5);
      background: rgba(49, 134, 255, 0.12);
    }

    .account-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3186ff, #fc413d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .account-name {
      font-size: 0.875rem;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .active-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      background: rgba(49, 134, 255, 0.25);
      color: #60a5fa;
      border: 1px solid rgba(49, 134, 255, 0.35);
      text-transform: uppercase;
    }

    .account-email {
      font-size: 0.75rem;
      color: #888888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.825rem;
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .btn-switch {
      background: #3186ff;
      color: #ffffff;
    }

    .btn-switch:hover {
      background: #2563eb;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      color: #888888;
      padding: 0.4rem;
      border-radius: 6px;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .btn-google {
      width: 100%;
      background: #262626;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding: 0.65rem 1rem;
      font-weight: 500;
      border-radius: 8px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
      margin-bottom: 0.75rem;
    }

    .btn-google:hover {
      background: #303030;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-launch-ide {
      width: 100%;
      background: #00b95c;
      color: #ffffff;
      padding: 0.65rem 1rem;
      font-weight: 600;
      border-radius: 8px;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .btn-launch-ide:hover {
      background: #009e4f;
    }

    .footer-link {
      color: #777777;
      font-size: 0.8rem;
      text-decoration: underline;
      transition: color 0.2s ease;
      margin-top: 0.5rem;
    }

    .footer-link:hover {
      color: #bbbbbb;
    }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 13, 13, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(49, 134, 255, 0.2);
      border-top-color: #3186ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-msg {
      font-size: 0.85rem;
      color: #888888;
    }
  
    @keyframes loadingPulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

  </style>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">

</head>

        <p style="font-size:0.825rem; color:#a0a0a0; margin-bottom:1rem; line-height:1.45;">
          1. Выберите аккаунт в открывшейся вкладке Google.<br>
          2. Скопируйте ссылку из адресной строки и вставьте её ниже:
        </p>
        
        <div style="position:relative; margin-bottom:1.25rem;">
          <input id="oauthUrlInput" type="text" placeholder="Вставьте ссылку (http://127.0.0.1...)" style="width:100%; padding:0.75rem 0.85rem; background:#222222; border:1px solid rgba(255,255,255,0.15); border-radius:10px; color:#ffffff; font-size:0.85rem; outline:none; transition:border-color 0.2s ease;" />
        </div>

        <div style="display:flex; gap:0.6rem; justify-content:flex-end;">
          <button id="cancelModalBtn" class="btn" style="background:#2a2a2a; color:#aaaaaa;">Отмена</button>
          <button id="autoPasteBtn" class="btn" style="background:#333333; color:#ffffff;" title="Вставить из буфера обмена">📋 Из буфера</button>
          <button id="submitCodeBtn" class="btn btn-switch">Подтвердить и войти</button>
        </div>
      </div>
    </div>
    <!-- OAuth Code Modal End -->

  <script>
    const API_BASE = "/auth-api";

    function showLoading(msg) {
      document.getElementById("loadingText").innerText = msg || "Обработка...";
      document.getElementById("loadingOverlay").classList.add("active");
    }

    function hideLoading() {
      document.getElementById("loadingOverlay").classList.remove("active");
    }

    async function loadAccounts() {
      try {
        const res = await fetch(API_BASE + "/accounts");
        const data = await res.json();
        if (data.success) {
          renderAccounts(data.accounts);
        }
      } catch (e) {
        console.error("Failed to load accounts:", e);
      }
    }

    function renderAccounts(accounts) {
      const container = document.getElementById("accountList");
      container.innerHTML = "";

      if (!accounts || accounts.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#777777; padding:1rem; font-size:0.825rem;">Нет доступных аккаунтов. Нажмите "Continue with Google".</div>';
        return;
      }

      accounts.forEach(acc => {
        const card = document.createElement("div");
        card.className = "account-card" + (acc.isActive ? " active" : "");
        
        const initial = (acc.name || acc.email || "A").charAt(0).toUpperCase();
        const safeName = escapeHtml(acc.name);
        const safeEmail = escapeHtml(acc.email);

        const activeBadge = acc.isActive ? '<span class="active-badge">Активен</span>' : '';
        const switchBtn = !acc.isActive ? `<button class="btn btn-switch" onclick="switchAccount('${acc.id}')">Войти</button>` : '';

        card.innerHTML = `
          <div class="account-info">
            <div class="avatar">${initial}</div>
            <div class="details">
              <div class="name-row">
                <span class="account-name">${safeName}</span>
                ${activeBadge}
              </div>
              <span class="account-email">${safeEmail}</span>
            </div>
          </div>
          <div class="actions">
            ${switchBtn}
            <button class="btn btn-icon" title="Переименовать" onclick="renameAccount('${acc.id}', '${escapeJsStr(acc.name)}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn btn-icon btn-danger" title="Удалить" onclick="deleteAccount('${acc.id}', '${escapeJsStr(acc.email)}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function runActivationSequence(actionFn) {
      const modal = document.getElementById("progressModal");
      const bar = document.getElementById("progressBarFill");
      const statusText = document.getElementById("progressStatusText");
      const percentText = document.getElementById("progressPercentText");
      const icon = document.getElementById("progressIcon");
      const title = document.getElementById("progressTitle");

      modal.style.display = "flex";
      icon.innerText = "⚡";
      title.innerText = "Активация аккаунта";
      bar.style.width = "15%";
      statusText.innerText = "Установка нового токена авторизации...";
      percentText.innerText = "15%";

      let actionRes = null;
      try {
        actionRes = await actionFn();
      } catch (e) {
        modal.style.display = "none";
        alert("Ошибка выполнения: " + e.message);
        return;
      }

      if (!actionRes || !actionRes.success) {
        modal.style.display = "none";
        alert("Ошибка: " + (actionRes ? actionRes.error : "Неизвестная ошибка"));
        return;
      }

      bar.style.width = "45%";
      statusText.innerText = "Перезапуск сервера Antigravity...";
      percentText.innerText = "45%";

      await new Promise(r => setTimeout(r, 1200));

      bar.style.width = "75%";
      statusText.innerText = "Проверка готовности сервера (health check)...";
      percentText.innerText = "75%";

      let isReady = false;
      let attempts = 0;
      const maxAttempts = 25;

      while (!isReady && attempts < maxAttempts) {
        attempts++;
        try {
          const pingRes = await fetch(API_BASE + "/ping?t=" + Date.now());
          const pingData = await pingRes.json();
          if (pingData.success && pingData.ready) {
            isReady = true;
            break;
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 600));
      }

      if (isReady) {
        bar.style.width = "100%";
        icon.innerText = "✅";
        title.innerText = "Сервер готов!";
        statusText.innerText = "Переход в Antigravity Web IDE...";
        percentText.innerText = "100%";
        setTimeout(() => {
          window.location.href = "/";
        }, 800);
      } else {
        bar.style.width = "90%";
        statusText.innerText = "Сервер запущен. Перенаправление...";
        setTimeout(() => {
          window.location.href = "/";
        }, 1200);
      }
    }

    async function switchAccount(id) {
      runActivationSequence(async () => {
        const res = await fetch(API_BASE + "/switch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        return await res.json();
      });
    }

    async function renameAccount(id, oldName) {
      const newName = prompt("Введите новое имя аккаунта:", oldName);
      if (!newName || newName.trim() === oldName) return;

      showLoading("Сохранение...");
      try {
        const res = await fetch(API_BASE + "/rename", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, name: newName.trim() })
        });
        const data = await res.json();
        hideLoading();
        if (data.success) {
          loadAccounts();
        } else {
          alert("Ошибка: " + data.error);
        }
      } catch (e) {
        hideLoading();
        alert("Ошибка: " + e.message);
      }
    }

    async function deleteAccount(id, email) {
      if (!confirm("Удалить аккаунт " + email + "?")) return;

      showLoading("Удаление...");
      try {
        const res = await fetch(API_BASE + "/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        hideLoading();
        if (data.success) {
          loadAccounts();
        } else {
          alert("Ошибка: " + data.error);
        }
      } catch (e) {
        hideLoading();
        alert("Ошибка: " + e.message);
      }
    }

    let currentOAuthPort = 8888;

    document.getElementById("addAccountBtn").addEventListener("click", async () => {
      showLoading("Запуск входа через Google...");
      try {
        const res = await fetch(API_BASE + "/oauth/start");
        const data = await res.json();
        hideLoading();
        if (data.success && data.authUrl) {
          currentOAuthPort = data.port || 8888;
          window.open(data.authUrl, "_blank");
          document.getElementById("oauthUrlInput").value = "";
          document.getElementById("oauthModal").style.display = "flex";
        } else {
          alert("Ошибка запуска OAuth: " + (data.error || ""));
        }
      } catch (e) {
        hideLoading();
        alert("Ошибка: " + e.message);
      }
    });

    document.getElementById("cancelModalBtn").addEventListener("click", () => {
      document.getElementById("oauthModal").style.display = "none";
    });

    window.addEventListener("focus", async () => {
      const modal = document.getElementById("oauthModal");
      if (modal && modal.style.display !== "none") {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text && (text.includes("code=") || text.includes("oauth-callback"))) {
              document.getElementById("oauthUrlInput").value = text.trim();
            }
          }
        } catch (e) {}
      }
    });

    document.getElementById("autoPasteBtn").addEventListener("click", async () => {
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const text = await navigator.clipboard.readText();
          if (text) {
            document.getElementById("oauthUrlInput").value = text.trim();
          }
        } else {
          alert("Используйте комбинацию Ctrl+V для вставки.");
        }
      } catch (e) {
        alert("Нажмите Ctrl+V в поле ввода для вставки ссылки.");
      }
    });

    document.getElementById("submitCodeBtn").addEventListener("click", async () => {
      const inputVal = document.getElementById("oauthUrlInput").value.trim();
      if (!inputVal) {
        alert("Вставьте скопированный URL или код из адресной строки.");
        return;
      }
      document.getElementById("oauthModal").style.display = "none";

      runActivationSequence(async () => {
        const res = await fetch(API_BASE + "/oauth/submit-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: inputVal, port: currentOAuthPort })
        });
        return await res.json();
      });
    });

    document.getElementById("launchIdeBtn").addEventListener("click", () => {
      window.location.href = "/";
    });

    document.getElementById("cloudProjLink").addEventListener("click", (e) => {
      e.preventDefault();
      alert("Используется стандартный Google Cloud проект Antigravity Suite.");
    });

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsStr(str) {
      return JSON.stringify(String(str || "")).slice(1, -1);
    }

    loadAccounts();
  </script>
</body>
</html>
